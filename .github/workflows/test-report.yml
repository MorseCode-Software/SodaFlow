# Turns the test results from a Build run into a Tests check run.
#
# This is the second half of build.yml's test reporting, and it is a separate workflow for one
# reason: a pull request raised from a fork runs with a read-only token and cannot create a check
# run. Anything reporting from inside build.yml therefore has to choose - annotate failures and give
# fork contributors nothing, or serve everyone and annotate nobody. Both of those were tried there
# before this file existed.
#
# workflow_run is the way out, and it is the reporter's own recommended setup for a public
# repository. A workflow_run workflow is not the pull request's code: it runs from the default
# branch, in this repository's context, with whatever permissions it declares - so it can write a
# check run for a fork's commit without the fork's build ever holding a token that could. It sees
# only the artifact, never the fork's code, which is what makes that safe.
#
# THE CATCH, and it is worth knowing before wondering why nothing appeared: a workflow_run workflow
# only runs once it is on the default branch. Until this file is merged to main, Build produces the
# artifact and no Tests check run follows it, on this pull request included.
name: Test Report

on:
  workflow_run:
    workflows: [ 'Build' ]
    types: [ completed ]

permissions:
  # contents to read the repository, actions to list and download the artifact from the run that
  # triggered this, checks to create the check run. Naming one drops every other to none.
  contents: read
  actions: read
  checks: write

jobs:
  report:
    name: Report
    # ubuntu, unlike everything else here. Nothing is built or run: the action pulls an artifact
    # through the API and parses XML, and none of that needs the Windows image the tests needed.
    runs-on: ubuntu-latest

    # A cancelled Build uploads no results - see the !cancelled() on that step - so there would be
    # nothing to report and the download would be the only thing to notice. Skipped explicitly
    # instead, because completed includes cancelled and a check run for a superseded commit is worse
    # than no check run.
    if: github.event.workflow_run.conclusion != 'cancelled'

    steps:
      # No checkout. The action reaches the artifact through the API, and checking out the code
      # would only add a way for this workflow to run something it was handed.
      #
      # The artifact name is the contract with build.yml's Collect test results step; path is a
      # glob inside the unpacked artifact, and stays broad because upload-artifact roots an archive
      # at the common ancestor of what it matched, which is a detail neither file should depend on.
      #
      # fail-on-error is on. With it off, the action completes the check run with success whatever
      # the results are, and only the title of the check run tells of a failed test. With it on, the
      # check run fails when a test failed, and the step fails too. continue-on-error keeps that
      # from the job. The job of this workflow is a check on the newest commit of main, whichever
      # Build started it, so a failed test of a pull request must not make that check fail.
      # build.yml pairs fail-on-error and continue-on-error in the same way for the coverage upload.
      #
      # fail-on-empty is off. A Build that failed before writing any results should be read as a
      # failed Build, not as a failed report of one.
      - name: Report tests
        id: report
        # This step fails when a test failed, as the comment above says. It can also fail with every
        # test passed, as the comment below the step says. continue-on-error keeps the two from the
        # job, and lets the job go on to the second attempt.
        continue-on-error: true
        uses: dorny/test-reporter@v3
        # The anchor gives these inputs to the second attempt, so that they are written one time.
        with: &report-inputs
          artifact: test-results
          name: Tests
          path: '**/*.trx'
          reporter: dotnet-trx
          # The point of this whole arrangement. Every suite and every test, with failures annotated
          # on the lines they happened on, rather than the counts a summary would give.
          use-actions-summary: false
          list-suites: all
          list-tests: all
          # 50 is the highest the action accepts. A run with more than fifty distinct failures has a
          # problem the annotations were not going to explain, and the full list is in the check run
          # either way.
          max-annotations: 50
          fail-on-error: true
          fail-on-empty: false

      # The action creates its check run, and then updates it with the result. Since 2026-11-09
      # that update is sometimes answered Not Found, a moment after the create succeeded. The action
      # sends the update one time, so the step failed with no test failed, and the check run that it
      # had created stayed in progress for good.
      #
      # dorny/test-reporter#866 has the measurements. A plain create and update with the token of a
      # job gets the same answer, so the fault is in the API. A second attempt 2.4 seconds later can
      # fail too, and 10 seconds later it worked every time. So this waits 10 seconds and runs the
      # action once more.
      #
      # It runs only when the first attempt failed and has no conclusion. The action sets that
      # output after its update succeeds, so an empty one means that the update, or a step before
      # it, failed. When the first attempt failed because a test failed, it has a conclusion, and
      # the action does not run again.
      #
      # The second attempt creates a new check run of the same name. GitHub shows the newest check
      # run of a name on a commit, so the one that stays in progress does not show. Measured on
      # 2026-11-12 in MorseCode.Toolkit, which has this file too: a rerun of two failed runs did
      # exactly that, on main and on a pull request.
      #
      # Remove the steps from here to the end when the action retries its own update.
      - name: Wait before the second attempt
        if: steps.report.outcome == 'failure' && steps.report.outputs.conclusion == ''
        run: sleep 10

      - name: Report tests, second attempt
        id: second
        if: steps.report.outcome == 'failure' && steps.report.outputs.conclusion == ''
        # As for the first attempt: a failed test fails this step, and not the job.
        continue-on-error: true
        uses: dorny/test-reporter@v3
        with: *report-inputs

      # continue-on-error on the second attempt also keeps a second Not Found from the job. Then
      # each check run that the two attempts created stays in progress, and this step fails the job,
      # so that the fault shows.
      - name: Fail when no attempt completed the check run
        if: steps.second.outcome == 'failure' && steps.second.outputs.conclusion == ''
        run: |
          echo "::error::No attempt completed the check run Tests. Each attempt logs its error."
          exit 1
