# Builds and inspects the sample solutions under samples/.
#
# Independent of appveyor.yml, which builds, tests, packs and publishes the libraries under src/,
# and of docs.yml, which builds the documentation site. Nothing is shared between the three.
#
# Triggered by the shared rule set and by build.cake as well as by samples/ itself, because the
# inspection below reads both - a rule changed in one place has to be re-run against all three
# samples, not just noticed the next time someone edits one.
#
# Otherwise not triggered by changes under src/. The samples reference published NuGet packages
# rather than the projects in this repository - see the comment in any sample's .csproj - so a
# change to src/ cannot affect them, and this filter has no false negative to worry about. The other
# side of that is what this build does NOT tell you: because each sample pins a package version, a
# newly released package breaking a sample shows up only when someone bumps that version here.
name: Samples

on:
  push:
    branches: [ main ]
    paths:
      - 'samples/**'
      - 'src/SodaFlow.sln.DotSettings'
      - 'build.cake'
      - '.github/workflows/samples.yml'
  pull_request:
    paths:
      - 'samples/**'
      - 'src/SodaFlow.sln.DotSettings'
      - 'build.cake'
      - '.github/workflows/samples.yml'
  workflow_dispatch:

jobs:
  build:
    # Windows because the WPF head of every sample targets net8.0-windows. The Avalonia heads and
    # the view models would build anywhere; splitting the job to save that is not worth the noise.
    runs-on: windows-latest

    strategy:
      # One sample failing should not hide the state of the other two.
      fail-fast: false
      matrix:
        sample: [ Counter, Search, Bounce ]

    name: ${{ matrix.sample }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          # 10.0 is what global.json pins, and is what actually runs the build. 8.0 is installed
          # alongside it so the net8.0 and net8.0-windows targets have their targeting packs
          # present rather than acquired during the build.
          dotnet-version: |
            8.0.x
            10.0.x

      # Warnings are errors here because these are teaching code. All three solutions build clean
      # today, so anything new is a regression rather than a backlog.
      - name: Build
        run: dotnet build samples/${{ matrix.sample }}/SodaFlow.Samples.${{ matrix.sample }}.slnx --configuration Release -warnaserror

      # inspectcode ships as a local tool, pinned in .config/dotnet-tools.json alongside Cake, so
      # CI inspects with the version a developer does.
      - name: Restore tools
        run: dotnet tool restore

      # The step lives in build.cake rather than here, so it can be run locally the same way:
      #
      #     dotnet cake --target=Inspect-Sample --sample=Bounce
      #
      # It reads src/SodaFlow.sln.DotSettings - the one rule set every solution is held to - and
      # fails on anything it finds, suggestions included, exactly as the inspection over src does.
      #
      # THESE STEPS FAIL TODAY, and are added ahead of the fixes on purpose: 121 issues across the
      # three samples, none of them yet addressed. The build going red is the point until they are.
      - name: Inspect
        run: dotnet cake --target=Inspect-Sample --sample=${{ matrix.sample }}
