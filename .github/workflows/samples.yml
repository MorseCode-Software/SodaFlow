# Builds and inspects the sample solutions under samples/.
#
# Independent of build.yml, which builds, tests, packs, inspects and publishes the libraries under
# src/, and of docs.yml, which builds the documentation site. Nothing is shared between the three.
#
# THERE IS NO PATHS FILTER ANY MORE, and its absence is load-bearing. Counter, Search and Bounce
# are required status checks on main. A required check reports nothing at all when its workflow is
# filtered out of a run - GitHub does not read that as "passed", it reads it as "still waiting" -
# so a pull request touching only src/ would have sat unmergeable forever. Skipping a job inside a
# workflow that ran is fine and reports as success; skipping the workflow is not.
#
# So these jobs now run on every pull request and every push to main, which costs a parallel job
# per sample of about three minutes against a Build that takes nine. That is the price of the gate,
# and it is worth saying plainly that for Counter, Search and Bounce it buys nothing else: what the
# filter used to say is still true of them, and is still worth knowing.
#
#   - A change under src/ cannot affect Counter, Search or Bounce. They reference published NuGet
#     packages rather than the projects in this repository - see the comment in any sample's
#     .csproj - so their runs will pass for reasons that have nothing to do with the change that
#     started them.
#   - Accounts is the exception, and runs here for the opposite reason. It references the projects
#     under src/ until the collections packages ship - see the comment in its view model's .csproj
#     - so a change under src/ can break it, and this job is where that shows. It is deliberately
#     not a required check: work in progress in the library should not be able to block a merge
#     through a sample. It is built but not yet inspected; see the Inspect step.
#   - The other side of that, unchanged: because each sample pins a package version, a newly
#     released package breaking a sample shows up only when someone bumps that version here.
#   - build.cake matters to these jobs even though it lives elsewhere, because the inspection step
#     below is defined there: a rule excluded or a threshold moved changes what these samples are
#     held to.
#   - So does src/SodaFlow.sln.DotSettings, the rule set that inspection reads. It cannot change
#     on its own: Verify-Inspection-Settings requires the three copies beside the sample solutions
#     to be byte-identical to it, and that runs as a dependency of Build on every main build. So
#     either a rule change carries those copies with it, or the build is red.
name: Samples

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  # Uploading the inspection results to code scanning. Naming one permission drops every other to
  # none, so the read that checkout needs is spelled out rather than inherited.
  contents: read
  security-events: write

jobs:
  build:
    # Windows because WPF only builds there - every sample's .NET 10 WPF head, and Counter's .NET
    # Framework one. The Avalonia heads and the view models would build anywhere; splitting the job
    # to save that is not worth the noise.
    runs-on: windows-latest

    strategy:
      # One sample failing should not hide the state of the others.
      fail-fast: false
      matrix:
        sample: [ Counter, Search, Bounce, Accounts ]

    name: ${{ matrix.sample }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          # 10.0 is what global.json pins, what runs the build, and what every .NET head targets.
          # Nothing needs a second SDK: Counter's view model is netstandard2.0, and its .NET
          # Framework head takes its reference assemblies from a package rather than an installed
          # targeting pack - see samples/Directory.Build.props.
          dotnet-version: 10.0.x

      # Warnings are errors here because these are teaching code. Every solution builds clean
      # today, so anything new is a regression rather than a backlog. For Accounts this builds the
      # libraries it references under src/ too, in the same configuration.
      - name: Build
        run: dotnet build samples/${{ matrix.sample }}/SodaFlow.Samples.${{ matrix.sample }}.slnx --configuration Release -warnaserror

      # The step lives in build.cake rather than here, so it can be run locally the same way:
      #
      #     dotnet cake --target=Inspect-Sample --sample=Bounce
      #
      # It reads src/SodaFlow.sln.DotSettings - the one rule set every solution is held to - and
      # fails on anything it finds at any severity, hints included, exactly as the inspection over
      # src does.
      #
      # Still on v3 while every other action here is on a Node 24 major. cake-action has moved to
      # Node 24 on its default branch but has not released it - v3.0.1, and the v3 tag, are still
      # Node 20 - so this step keeps the deprecation notice until upstream cuts a release. Pinning
      # to an unreleased commit to silence a warning is the worse trade.
      #
      # cake-version: tool-manifest is the load-bearing input. Without it the action installs a
      # Cake of its own choosing, and CI would stop running the version pinned in
      # .config/dotnet-tools.json - which is the whole reason that manifest exists. With it, the
      # action restores the local tools, so inspectcode's `jb` arrives too and needs no step of
      # its own.
      #
      # Not for Accounts yet. Its solution builds clean, but InspectCode finds issues in it - most
      # of them in the drain benchmarks project - and this step fails on any. Until those are fixed,
      # inspecting it would only turn the job red on every run and hide whether it still builds.
      # Drop the condition here and on the upload below once it inspects clean.
      - name: Inspect
        if: matrix.sample != 'Accounts'
        uses: cake-build/cake-action@v3
        with:
          target: Inspect-Sample
          cake-version: tool-manifest
          arguments: |
            sample: ${{ matrix.sample }}

      # The SARIF the step above already wrote, handed to code scanning so the findings land on the
      # lines they are about - in the Files tab of a pull request and in the Security tab - instead
      # of only in a log that has to be opened and scrolled.
      #
      # Every severity is in it, hints included - the same report the step above fails on, so what
      # code scanning shows is exactly what the build refused.
      #
      # always(), because the step that produces it fails by design while there are findings, and
      # those are exactly the runs worth annotating. continue-on-error, because this is
      # presentation: if the upload breaks, the inspection result is still the one that failed the
      # job, and an upload problem should not be mistaken for a code problem.
      #
      # category keeps the samples apart. Without it each upload replaces the last for this
      # commit, and only whichever job finished last would be visible.
      - name: Upload inspection results
        if: always() && matrix.sample != 'Accounts'
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: inspection/inspectcode-${{ matrix.sample }}.sarif
          category: samples-${{ matrix.sample }}
