# Fails a pull request that makes the loop analyzer slower than the analyzer of its base. The targets
# Measure-Analyzer and Compare-Analyzer of build.cake do the work and have the reasons for how they
# measure. This file selects the runners, the baseline, and when to run.
#
# A workflow of its own, and not a job of build.yml, because it is not related to the build, the
# tests, or the release. It runs at the same time as Build and takes less time, thus a pull request
# waits no longer for it.
name: Analyzer timing

# No paths filter. A required check that a paths filter skips never reports, and the pull request
# waits for it. The first job looks at the changed paths itself. When none of them can change the
# analyzer or the measurement, the check passes in about a minute.
#
# workflow_dispatch times the analyzer of a branch against any baseline, for a measurement by hand.
on:
  pull_request:
  workflow_dispatch:
    inputs:
      baseline:
        description: The commit or branch whose analyzer is the base side.
        default: origin/main
        required: true

permissions:
  contents: read

# A new push to a pull request cancels the timing of the push before it. The timing of a commit that
# is not the head of the pull request has no use.
concurrency:
  group: analyzer-timing-${{ github.ref }}
  cancel-in-progress: true

env:
  CONFIGURATION: Release
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

defaults:
  run:
    shell: pwsh

# Each job waits for the job before it. "change" finds if the pull request can change the time of the
# analyzer. "measure" measures all three sides on more than one runner, one job for each runner, and
# does not give a result. "time" gives the result from the median of the measure jobs, and it is the
# required check.
#
# The ratio of the candidate to the base changes from one runner to the next by more than the
# control of one runner shows. In Round 5 of the loop analyzer (AO13), the view models were 3.5%
# slower on one runner and 8.0% slower on a different one, with the same two analyzers. Thus, one
# runner cannot give a result for a limit of 5%. build.cake has the full reason.
jobs:
  change:
    name: Find an analyzer change
    runs-on: ubuntu-latest
    timeout-minutes: 10

    outputs:
      baseline: ${{ steps.change.outputs.baseline }}
      changed: ${{ steps.change.outputs.changed }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The base of the pull request must be in the clone for the difference.
          fetch-depth: 0

      # On a pull request, the checkout is the merge of the pull request into its base, thus the
      # difference from the base sha is the change of the pull request and nothing else.
      #
      # The paths are the analyzer, the measurement, and the build settings of both. A change to
      # the code that the workloads have is not in the list: the two sides read the same tree, thus
      # such a change cannot make one side slower than the other.
      - name: Find an analyzer change
        id: change
        env:
          EVENT: ${{ github.event_name }}
          PULL_REQUEST_BASE: ${{ github.event.pull_request.base.sha }}
          DISPATCH_BASELINE: ${{ inputs.baseline }}
        run: |
          $ErrorActionPreference = 'Stop'

          if ($env:EVENT -eq 'workflow_dispatch') {
              "baseline=$env:DISPATCH_BASELINE" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
              "changed=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
              exit 0
          }

          git diff --quiet $env:PULL_REQUEST_BASE HEAD -- `
              src/Analyzers/SodaFlow.Analyzers `
              src/Analyzers/SodaFlow.Analyzers.Timing `
              src/Directory.Build.props `
              src/Directory.Build.targets `
              global.json `
              build.cake `
              .config/dotnet-tools.json `
              .github/workflows/analyzer-timing.yml
          $difference = $LASTEXITCODE

          if ($difference -gt 1) {
              throw "git diff failed (exit $difference)."
          }

          "baseline=$env:PULL_REQUEST_BASE" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "changed=$($difference -eq 1)".ToLowerInvariant() | Out-File -FilePath $env:GITHUB_OUTPUT -Append

          if ($difference -eq 0) {
              Write-Host "The pull request changes nothing that can change the time of the analyzer."
          }

          # git diff gave 1 for a difference, which is not a failure of this step.
          exit 0

  # Each job of the matrix is a different runner, and each one measures all three sides, as
  # Time-Analyzer does on one machine. The jobs run at the same time, thus the check takes no longer
  # than one job, but it uses more runner time. With three jobs, the median ignores one runner that
  # is far from the other two.
  measure:
    name: Measure the analyzer (job ${{ matrix.job }})
    needs: change
    if: needs.change.outputs.changed == 'true'
    # The calibration found the same noise on ubuntu-latest and windows-latest. Ubuntu sets up .NET
    # in about 12 seconds, and Windows in 60 to 110. The timing builds net10.0 only, thus it does
    # not need the net472 targets that keep build.yml on Windows.
    runs-on: ubuntu-latest
    timeout-minutes: 45

    strategy:
      # A failed job fails the check in any case. The other jobs go on, thus "Re-run failed jobs"
      # runs again only the job that failed, and not all of them.
      fail-fast: false
      matrix:
        job: [ 1, 2, 3 ]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # MinVer reads the tags, and the baseline must be in the clone.
          fetch-depth: 0

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          # 6.0 for the same reason as in build.yml: the library projects restore a net6.0 target,
          # and their lock files have no reference pack for it.
          dotnet-version: 6.0.x
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            **/packages.lock.json
            .config/dotnet-tools.json

      - name: Restore tools
        run: dotnet tool restore

      - name: Measure the analyzer
        env:
          BASELINE: ${{ needs.change.outputs.baseline }}
        run: dotnet cake --target=Measure-Analyzer --configuration=${{ env.CONFIGURATION }} "--baseline=$env:BASELINE"

      # The round files of this job, for the job "time". Each artifact has a name of its own, and
      # the job "time" downloads each one into a folder with that name.
      - name: Keep the rounds
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: analyzer-timing-job-${{ matrix.job }}
          path: analyzer-timing/results

  # The job name is the name of the status check, which is a required check on main. A change of
  # this name needs a change of the ruleset.
  #
  # !cancelled() and not success(), because this job must give the result in all cases. When "change"
  # finds no analyzer change, GitHub skips "measure", and this job passes. When "change" or a job of
  # "measure" fails, GitHub skips the dependents by default. A skipped job reports success, also as a
  # required check, thus the pull request can merge with no timing. Thus, this job runs and fails.
  time:
    name: Analyzer timing
    needs: [ change, measure ]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Read the result of the jobs before
        id: jobs
        env:
          CHANGE: ${{ needs.change.result }}
          CHANGED: ${{ needs.change.outputs.changed }}
          MEASURE: ${{ needs.measure.result }}
        run: |
          $ErrorActionPreference = 'Stop'

          if ($env:CHANGE -ne 'success') {
              throw "The job that finds an analyzer change did not succeed ($env:CHANGE)."
          }

          if ($env:CHANGED -ne 'true') {
              Write-Host "The pull request changes nothing that can change the time of the analyzer."
              "compare=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
              exit 0
          }

          # The result of a matrix is success only when each of its jobs succeeded.
          if ($env:MEASURE -ne 'success') {
              throw "A job that measures the analyzer did not succeed ($env:MEASURE). Run the failed jobs again."
          }

          "compare=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.jobs.outputs.compare == 'true'
        with:
          # MinVer reads the tags when this job builds the timing app.
          fetch-depth: 0

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        if: steps.jobs.outputs.compare == 'true'
        with:
          dotnet-version: 6.0.x
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            **/packages.lock.json
            .config/dotnet-tools.json

      - name: Restore tools
        if: steps.jobs.outputs.compare == 'true'
        run: dotnet tool restore

      - name: Download the rounds
        if: steps.jobs.outputs.compare == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: analyzer-timing-job-*
          path: analyzer-timing/jobs

      - name: Compare the analyzers
        if: steps.jobs.outputs.compare == 'true'
        run: dotnet cake --target=Compare-Analyzer --configuration=${{ env.CONFIGURATION }} --jobs=analyzer-timing/jobs

      # The table on the page of the run, which is the place where a person looks first.
      - name: Write the summary
        if: ${{ !cancelled() && steps.jobs.outputs.compare == 'true' && hashFiles('analyzer-timing/summary.md') != '' }}
        run: Get-Content analyzer-timing/summary.md | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append

      # Each pass of each round of each job, to compute other statistics from a run.
      - name: Collect the samples
        if: ${{ !cancelled() && steps.jobs.outputs.compare == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: analyzer-timing
          path: |
            analyzer-timing/jobs
            analyzer-timing/summary.md
