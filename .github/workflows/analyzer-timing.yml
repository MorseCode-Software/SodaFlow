# Fails a pull request that makes the loop analyzer slower than the analyzer of its base. The target
# Time-Analyzer of build.cake does the work and has the reasons for how it measures; this file
# selects the runner, the baseline, and when to run.
#
# A workflow of its own, and not a job of build.yml, because it is not related to the build, the
# tests, or the release. It runs at the same time as Build and takes less time, thus a pull request
# waits no longer for it.
name: Analyzer timing

# No paths filter. A required check that a paths filter skips never reports, and the pull request
# waits for it. The job looks at the changed paths itself, and when none of them can change the
# analyzer or the measurement, it passes in about a minute.
#
# workflow_dispatch times the analyzer of a branch against any baseline, for a measurement by hand.
on:
  pull_request:
  workflow_dispatch:
    inputs:
      baseline:
        description: The commit or branch whose analyzer is the base side.
        default: origin/main
        required: true

permissions:
  contents: read

# A new push to a pull request cancels the timing of the push before it. The timing of a commit that
# is not the head of the pull request has no use.
concurrency:
  group: analyzer-timing-${{ github.ref }}
  cancel-in-progress: true

env:
  CONFIGURATION: Release
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

defaults:
  run:
    shell: pwsh

jobs:
  # The job name is the name of the status check. If the check becomes a required check, a change
  # of this name needs a change of the ruleset.
  time:
    name: Analyzer timing
    # The calibration found the same noise on ubuntu-latest and windows-latest. Ubuntu sets up .NET
    # in about 12 seconds, and Windows in 60 to 110. The timing builds net10.0 only, thus it does
    # not need the net472 targets that keep build.yml on Windows.
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # MinVer reads the tags, and the baseline must be in the clone.
          fetch-depth: 0

      # On a pull request, the checkout is the merge of the pull request into its base, thus the
      # difference from the base sha is the change of the pull request and nothing else.
      #
      # The paths are the analyzer, the measurement, and the build settings of both. A change to
      # the code that the workloads have is not in the list: the two sides read the same tree, thus
      # such a change cannot make one side slower than the other.
      - name: Find an analyzer change
        id: change
        env:
          EVENT: ${{ github.event_name }}
          PULL_REQUEST_BASE: ${{ github.event.pull_request.base.sha }}
          DISPATCH_BASELINE: ${{ inputs.baseline }}
        run: |
          $ErrorActionPreference = 'Stop'

          if ($env:EVENT -eq 'workflow_dispatch') {
              "baseline=$env:DISPATCH_BASELINE" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
              "changed=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
              exit 0
          }

          git diff --quiet $env:PULL_REQUEST_BASE HEAD -- `
              src/Analyzers/SodaFlow.Analyzers `
              src/Analyzers/SodaFlow.Analyzers.Timing `
              src/Directory.Build.props `
              src/Directory.Build.targets `
              global.json `
              build.cake `
              .config/dotnet-tools.json `
              .github/workflows/analyzer-timing.yml
          $difference = $LASTEXITCODE

          if ($difference -gt 1) {
              throw "git diff failed (exit $difference)."
          }

          "baseline=$env:PULL_REQUEST_BASE" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "changed=$($difference -eq 1)".ToLowerInvariant() | Out-File -FilePath $env:GITHUB_OUTPUT -Append

          if ($difference -eq 0) {
              Write-Host "The pull request changes nothing that can change the time of the analyzer."
          }

          # git diff gave 1 for a difference, which is not a failure of this step.
          exit 0

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        if: steps.change.outputs.changed == 'true'
        with:
          # 6.0 for the same reason as in build.yml: the library projects restore a net6.0 target,
          # and their lock files have no reference pack for it.
          dotnet-version: 6.0.x
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            **/packages.lock.json
            .config/dotnet-tools.json

      - name: Restore tools
        if: steps.change.outputs.changed == 'true'
        run: dotnet tool restore

      - name: Time the analyzer
        if: steps.change.outputs.changed == 'true'
        env:
          BASELINE: ${{ steps.change.outputs.baseline }}
        run: dotnet cake --target=Time-Analyzer --configuration=${{ env.CONFIGURATION }} "--baseline=$env:BASELINE"

      # The table on the page of the run, which is the place where a person looks first.
      - name: Write the summary
        if: ${{ !cancelled() && steps.change.outputs.changed == 'true' && hashFiles('analyzer-timing/summary.md') != '' }}
        run: Get-Content analyzer-timing/summary.md | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append

      # Each pass of each round, to compute other statistics from a run.
      - name: Collect the samples
        if: ${{ !cancelled() && steps.change.outputs.changed == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: analyzer-timing
          path: |
            analyzer-timing/results
            analyzer-timing/summary.md
