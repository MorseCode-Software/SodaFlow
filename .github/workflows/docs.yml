# Builds the DocFX site under docs/ and publishes it to GitHub Pages.
#
# This is independent of build.yml, which builds, tests, packs and releases the .NET solution. The
# two do not share state: that one owns NuGet releases, this owns the documentation site.
name: Documentation

on:
  push:
    branches: [ main ]
    paths:
      - 'docs/**'
      - 'src/**'
      - 'logo/**'
      - '.config/dotnet-tools.json'
      - '.github/workflows/docs.yml'
  # Pull requests have no path filter, so that the check of the build job can be required. GitHub waits
  # for a required check of a workflow that a path filter skips, and the pull request never merges.
  # samples.yml has no filter for the same cause. A push to main keeps its filter: only a change to the
  # site needs a deploy.
  pull_request:
  workflow_dispatch:

# The deploy job adds the two permissions that GitHub Pages needs. The build job, which each pull request
# runs, gets only this.
permissions:
  contents: read

# A group for each ref, so that a run of a pull request cannot cancel a run of main. GitHub cancels a run
# that waits in a group when a newer run comes into that group. With one group for each run, a pull
# request cancelled the deploy of main that waited. A newer push to a pull request cancels its older run.
concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The job name is the status check name, which the ruleset requires. A rename needs a matching ruleset
  # change.
  build:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          # 6.0 for the net6.0 target the docs are generated against. DocFX runs on the SDK that
          # global.json selects, the 10.0 SDK of the image, from the net10.0 build of the tool. Thus,
          # it needs no SDK from this step.
          dotnet-version: 6.0.x

      - name: Restore tools
        run: dotnet tool restore

      # Every C# project under src/ runs the loop analyzer, and DocFX loads each project with its
      # analyzers. DocFX does not build them: without the analyzer's dll it reports
      # FailedToResolveAnalyzer once for each project, and the warnings are errors. The analyzer
      # targets netstandard2.0 only, so this builds on Linux. Release, because docfx.json loads the
      # projects in that configuration and so looks for the dll under bin/Release.
      - name: Build analyzer
        run: dotnet build src/Analyzers/SodaFlow.Analyzers/SodaFlow.Analyzers.csproj --configuration Release -warnaserror

      - name: Build site
        run: dotnet docfx docs/docfx.json --warningsAsErrors

      # v5 rather than v3 for Node 24, which this action does not declare itself: it is a
      # composite, and the Node 20 came from the actions/upload-artifact it calls - v4 there in
      # its own v3, v7 in its v5.
      #
      # v4 of this action stopped including hidden files in the artifact. Checked rather than
      # assumed: a local docfx build writes no dotfile at all under docs/_site, so there is
      # nothing here for that change to drop.
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/_site

  # Pull requests build the site to catch breakage, but only main publishes it.
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    # Never let two publishes race. In-progress runs are allowed to finish so a deploy is not left
    # half-applied.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
