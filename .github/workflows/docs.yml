# Builds the DocFX site under docs/ and publishes it to GitHub Pages.
#
# This is independent of build.yml, which builds, tests, packs and releases the .NET solution. The
# two do not share state: that one owns NuGet releases, this owns the documentation site.
name: Documentation

on:
  push:
    branches: [ main ]
    paths:
      - 'docs/**'
      - 'src/**'
      - '.config/dotnet-tools.json'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - 'docs/**'
      - 'src/**'
      - '.config/dotnet-tools.json'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two publishes race. In-progress runs are allowed to finish so a deploy is not left
# half-applied.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          # 6.0 for the net60 target the docs are generated against, 8.0 to run DocFX itself.
          dotnet-version: |
            6.0.x
            8.0.x

      - name: Restore tools
        run: dotnet tool restore

      # Only the projects DocFX extracts, and only their net60 target. Building the whole
      # solution here would fail: it also targets net472, which needs Windows.
      - name: Restore projects
        run: |
          dotnet restore src/SodaFlow.Core/SodaFlow.Core.csproj
          dotnet restore src/CSharp/SodaFlow/SodaFlow.csproj
          dotnet restore src/CSharp/SodaFlow.Functional/SodaFlow.Functional.csproj
          dotnet restore src/Async/SodaFlow.Core.Async/SodaFlow.Core.Async.csproj
          dotnet restore src/Async/CSharp/SodaFlow.Async/SodaFlow.Async.csproj

      - name: Build site
        run: dotnet docfx docs/docfx.json --warningsAsErrors

      # v5 rather than v3 for Node 24, which this action does not declare itself: it is a
      # composite, and the Node 20 came from the actions/upload-artifact it calls - v4 there in
      # its own v3, v7 in its v5.
      #
      # v4 of this action stopped including hidden files in the artifact. Checked rather than
      # assumed: a local docfx build produces 917 files under docs/_site and not one dotfile
      # among them, so there is nothing here for that change to drop.
      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs/_site

  # Pull requests build the site to catch breakage, but only main publishes it.
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
