# AppVeyor build for the .NET implementation under src.
#
# NOTE: committing this file supersedes the configuration currently held in the AppVeyor UI.
# Compare the two before enabling "use YAML from repository".
#
# Package versions are NOT set here. Each packable project derives its own version from git tags
# via MinVer (see src/Directory.Build.props), so pushing dotnet-async-csharp-1.1.0
# releases only SodaFlow.Async and leaves every other package on its own last tag. Deliberately
# absent, therefore, is AppVeyor's dotnet_csproj patcher: it stamps every matched project with a
# single shared version, which is the opposite of what this repository wants.

version: '{build}'

image: Visual Studio 2022

# MinVer reads the full commit graph and every tag. A shallow clone yields wrong versions, or none.
shallow_clone: false
clone_depth: 0

configuration: Release

environment:
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  SOLUTION: src\SodaFlow.sln
  NUGET_API_KEY:
    secure: wJnjNcFPeKed+NXnE+IjPM5sAlJxY1Q3noeEdWi1E070zGc/E+pm6Dx1f8s7gNHB
  # Coveralls repo token, encrypted under this AppVeyor account - a value encrypted elsewhere
  # would not decrypt here. Secure variables are withheld from pull requests raised on forks,
  # so the upload step logs and skips when it finds this unset rather than failing the build.
  COVERALLS_REPO_TOKEN:
    secure: J8UbS6aD6zFAKrkcSaALGcJnn0lYAzKjLNxPtisZczH+FD0/Vhp1eB6lFwZtaLvi

# The only coverage tool that needs installing is the uploader. Collection is done by the
# Microsoft Code Coverage collector that ships inside Microsoft.NET.Test.Sdk, and it writes
# Cobertura directly, so there is nothing to convert and nothing to merge.
install:
  - ps: Invoke-WebRequest -Uri "https://github.com/coverallsapp/coverage-reporter/releases/latest/download/coveralls-windows.exe" -OutFile "coveralls.exe"

# Every project in the solution is SDK-style now (the last legacy, packages.config holdouts —
# SodaFlow.Tests, .Tests.Internal, .Tests.Memory, .Tests.Performance — were converted alongside
# this file), so plain dotnet restore covers all of it. Confirmed locally: restores all sixteen
# projects with nothing left for nuget.exe to handle that this doesn't.
before_build:
  - dotnet --info
  - dotnet restore %SOLUTION%

# dotnet build, not msbuild: with no legacy projects left, there's no longer a reason to reach for
# the one tool that could build both — confirmed locally that dotnet build handles the whole
# solution, console benchmark included.
build_script:
  - dotnet build %SOLUTION% -c %CONFIGURATION%

# Every test project is SDK-style with Microsoft.NET.Test.Sdk + NUnit3TestAdapter now, so dotnet
# test runs all eight: the three original C# ones (SodaFlow.Tests, .Tests.Internal, .Tests.Memory
# — converted from legacy, packages.config projects specifically so they could pick up the test
# adapter), the two C# async ones converted the same way earlier, and the three F# ones (always
# SDK-style). SodaFlow.Tests.Performance is deliberately absent from this list — it is a console
# benchmark (OutputType Exe, no NUnit reference, no [Test] attributes), not a test project; dotnet
# test would just report "no test is available" for it.
#
# Confirmed locally against a Debug build of this solution: 240, 7, 6+5, 153+5, 4+1, 14, 19 and 21
# tests respectively — 0 failed anywhere.
#
# The 6+5 is SodaFlow.Tests.Memory. Its original StreamTests count live objects with dotMemory,
# which isn't installed on a CI agent, so those five are tagged [Ignore("Requires dotMemory.")] and
# skip. The others are GarbageCollectionTests, which assert the same lifetime invariants using only
# weak references, the node's listener set, and the manager's registry count, so they do run here.
# Keep it that way: they are the only automated cover for stream/listener cleanup, and each one has
# been checked to fail when the cleanup it guards is broken.
# One dotnet test over the solution, collecting coverage as it runs.
#
# The Microsoft Code Coverage collector ships inside Microsoft.NET.Test.Sdk and writes Cobertura
# directly, which is the format the Coveralls reporter accepts, so nothing has to be converted and
# nothing merged: a solution-level run produces a single report covering all seven shipping
# assemblies. Scoping and exclusions live in coverage.runsettings.
#
# This needed Microsoft.NET.Test.Sdk moved from 15.9.0 to 17.11.1 across the test projects. The
# 2018-era collector predates Cobertura output and fails with a VanguardException ("Running event
# not received from CodeCoverage.exe") when asked for it. That bump is confined to test projects
# and changes nothing the packages declare.
#
# Three earlier approaches are recorded so they are not retried blindly:
#
#   The NUnit console runner under OpenCover profiled cleanly, but on AppVeyor the run took close
#   to ten minutes and some tests failed under it that pass under dotnet test.
#
#   Coverlet works with dotnet test but breaks the F# suite: its instrumentation does not honour
#   the FSharp.Core binding redirect these projects rely on - the assemblies compile against
#   4.5.0.0 while 10.0.0.0 is deployed - so 150 of 153 F# tests fail to load FSharp.Core. Pinning
#   FSharp.Core does not dislodge the SDK's implicit reference, and pinning it up to 10.x would
#   raise the published dependency floor of SodaFlow.FSharp 1.0.0.
#
#   OpenCover wrapped around dotnet test hangs, at least locally: it sat at 0.9 seconds of CPU
#   while the child dotnet burned over 2,000 with no output. dotnet.exe is a CoreCLR host and
#   OpenCover's profiler is a .NET Framework CLR profiler.
#
# Verified locally against a Debug build: 457 passed, 0 failed across all eight suites in a single
# run, producing one report at 65% line coverage. SodaFlow.Tests.Performance sits in the solution
# and contributes no tests; the run does not mind.
test_script:
  - dotnet test %SOLUTION% -c %CONFIGURATION% --no-build --collect:"Code Coverage" --settings coverage.runsettings --results-directory coverage
# One dotnet pack over the whole solution now, rather than one invocation per packable project:
# the previous per-project list existed only to route around dotnet pack failing outright
# (MSB4057, "the target Pack does not exist") on the legacy test projects. With those gone, dotnet
# pack on the solution just packs the seven publishable projects and skips the nine test/benchmark
# ones. Eight of those nine reference Microsoft.NET.Test.Sdk, which the SDK reads as IsTestProject
# and defaults IsPackable to false for accordingly — no explicit opt-out needed, confirmed via
# dotnet msbuild -getProperty:IsPackable/-getProperty:IsTestProject. The ninth,
# SodaFlow.Tests.Performance, is a console benchmark with no test adapter reference at all, so it
# never gets that automatic IsTestProject treatment; it sets IsPackable false explicitly instead.
# Confirmed locally: produces the same seven packages the old per-project list did, nothing more,
# exit code 0.
after_test:
  # Convert to Cobertura, then hand it to Coveralls.
  #
  # AppVeyor is not one of the CI services the reporter auto-detects - that list is CircleCI,
  # GitHub Actions, Travis, Jenkins, GitLab, Semaphore, Wercker, Codeship, Drone, Buildkite,
  # Xcode Cloud and RWX - so every piece of build metadata is supplied explicitly. Without it the
  # upload would land with no job, branch or commit attached.
  #
  # This runs before the pack step so publishing coverage and producing packages cannot block one
  # another.
  - ps: |
      # The collector names the report after the machine and timestamp and puts it in a GUID
      # subdirectory, so it has to be found rather than assumed.
      $report = Get-ChildItem -Path coverage -Recurse -Filter *.cobertura.xml | Select-Object -First 1
      if (-not $report) { throw "No Cobertura report was produced." }
      Write-Host "Coverage report: $($report.FullName)"

      if (-not $env:COVERALLS_REPO_TOKEN) {
          Write-Host "COVERALLS_REPO_TOKEN is not set - skipping the coverage upload."
      } else {
          $arguments = @(
              "report"
              $report.FullName
              "--format=cobertura"
              "--repo-token=$env:COVERALLS_REPO_TOKEN"
              "--base-path=$env:APPVEYOR_BUILD_FOLDER"
              "--service-name=appveyor"
              "--service-job-id=$env:APPVEYOR_JOB_ID"
              "--service-branch=$env:APPVEYOR_REPO_BRANCH"
              "--service-build-url=https://ci.appveyor.com/project/$env:APPVEYOR_ACCOUNT_NAME/$env:APPVEYOR_PROJECT_SLUG/builds/$env:APPVEYOR_BUILD_ID"
          )
          if ($env:APPVEYOR_PULL_REQUEST_NUMBER) {
              $arguments += "--service-pull-request=$env:APPVEYOR_PULL_REQUEST_NUMBER"
          }
          & ".\coveralls.exe" @arguments
          if ($LASTEXITCODE -ne 0) { throw "Coveralls upload failed (exit $LASTEXITCODE)." }
      }
  - dotnet pack %SOLUTION% -c %CONFIGURATION% -o artifacts
  - ps: Get-ChildItem artifacts\*.nupkg | Sort-Object Name | ForEach-Object { Write-Host $_.Name }

artifacts:
  - path: artifacts\*.nupkg
    name: packages
  # Kept so a build whose upload was skipped or rejected can still be inspected.
  - path: coverage
    name: coverage

# Publishing is gated on a tag, which is what makes the release schedule per-package: MinVer gives a
# tagged build a stable version and every other build a prerelease one, so only deliberate tags can
# ever produce something publishable.
#
# Two details worth keeping:
#   *.symbols.nupkg is excluded — these projects set IncludeSource/IncludeSymbols, which emits the
#   legacy symbols format that nuget.org rejects.
#   --skip-duplicate means re-running a build over an already published version is a no-op rather
#   than a failure, so packages whose version did not move are simply left alone.
deploy_script:
  - ps: |
      if ($env:APPVEYOR_REPO_TAG -ne "true") {
          Write-Host "Not a tag build - skipping NuGet push.  APPVEYOR_REPO_TAG = $($env:APPVEYOR_REPO_TAG)"
          return
      }
      if (-not $env:NUGET_API_KEY) {
          throw "NUGET_API_KEY is not set. Add it as a secure variable in AppVeyor."
      }
      $packages = Get-ChildItem artifacts\*.nupkg | Where-Object { $_.Name -notlike "*.symbols.nupkg" }
      if (-not $packages) { throw "No packages found to push." }
      foreach ($package in $packages) {
          Write-Host "Pushing $($package.Name)"
          dotnet nuget push $package.FullName `
              --skip-duplicate `
              --api-key $env:NUGET_API_KEY `
              --source https://api.nuget.org/v3/index.json
          if ($LASTEXITCODE -ne 0) { throw "Failed to push $($package.Name)" }
      }
