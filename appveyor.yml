# AppVeyor build for the .NET implementation under src.
#
# NOTE: this file is what AppVeyor runs. The project has "use YAML from repository" enabled, so
# the settings still sitting in the AppVeyor UI - which name the Visual Studio 2015 image - are
# dead, and editing them changes nothing. Edit here.
#
# The check, if that ever needs confirming again from a build log alone: the image below runs
# Windows Server 2019, so `dotnet --info` reports OS Version 10.0.17763. The UI's Visual Studio
# 2015 image is Windows Server 2012 R2 and would report 6.3.9600. Reading 17763 as "an old image,
# therefore the UI settings" has the mapping backwards - see the image matrix at
# https://www.appveyor.com/docs/windows-images-software/, where Visual Studio 2019 through 2026 all
# share Windows Server 2019.
#
# NOTE: .github/workflows/build.yml runs the same build on GitHub Actions, and that is where this
# repository is going. The comparison the two were set up for has been decided in Actions' favour,
# largely on queue time: execution was 16 minutes here against 9 there, but the wait before a build
# started ran past an hour on a single concurrent job, and that is the number a person actually
# experiences.
#
# Releasing has already moved - see the deploy_script note at the bottom of this file. Everything
# else still runs here, so the two remain comparable while the rest of the migration is finished.
# This file goes away at the end of it rather than being split with the workflow.
#
# The steps themselves live in build.cake, not here. What is left in this file is the part that is
# genuinely AppVeyor's: which image to run on, what the environment holds, what to keep as an
# artifact, and when to invoke the build. Anything describing what the build *does* belongs next to
# the code that does it, where it can be run locally with `dotnet cake` and where a change to a step
# and a change to its explanation are the same edit.
#
# Package versions are NOT set here. Each packable project derives its own version from git tags
# via MinVer (see src/Directory.Build.props), so pushing sodaflow-async-2.1.0 releases only
# SodaFlow.Async and leaves every other package on its own last tag. Deliberately absent, therefore,
# is AppVeyor's dotnet_csproj patcher: it stamps every matched project with a single shared version,
# which is the opposite of what this repository wants.

version: '{build}'

image: Visual Studio 2026

# MinVer reads the full commit graph and every tag. A shallow clone yields wrong versions, or none.
shallow_clone: false
clone_depth: 0

configuration: Release

environment:
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  NUGET_API_KEY:
    secure: wJnjNcFPeKed+NXnE+IjPM5sAlJxY1Q3noeEdWi1E070zGc/E+pm6Dx1f8s7gNHB
  # Coveralls repo token, encrypted under this AppVeyor account - a value encrypted elsewhere
  # would not decrypt here. Secure variables are withheld from pull requests raised on forks,
  # so the upload step logs and skips when it finds this unset rather than failing the build.
  COVERALLS_REPO_TOKEN:
    secure: J8UbS6aD6zFAKrkcSaALGcJnn0lYAzKjLNxPtisZczH+FD0/Vhp1eB6lFwZtaLvi

# Cake and docfx are both local tools, pinned in .config/dotnet-tools.json, so the agent runs the
# same versions a developer does. The Coveralls reporter is no longer downloaded here: build.cake
# fetches it only when it is about to upload, which keeps a local run from pulling a Windows
# executable it will never invoke.
install:
  - dotnet tool restore

# The build is driven one phase at a time so that AppVeyor attributes a failure to the phase it
# happened in: a failing test reads as a failed test phase, not as a failed build.
#
# --exclusive runs the named task without its dependencies, because the dependencies belong to
# phases that have already run. The chain in build.cake is still the truth for a local `dotnet
# cake`; here AppVeyor provides the sequencing and Cake is asked for one step at a time. The cost is
# a Cake startup per phase, which is seconds against a build measured in minutes.
build_script:
  - dotnet cake --target=Build --configuration=%CONFIGURATION%

# Separate from the build so the Tests tab and the phase status mean what they say. build.cake also
# hands the trx files to AppVeyor's API here, which is what populates that tab with individual
# tests rather than a pass or fail for the whole run.
test_script:
  - dotnet cake --target=Test --exclusive --configuration=%CONFIGURATION%

# Inspect-Code is last of these deliberately. It fails the build on anything it finds, and a build
# failed by the inspection should still have uploaded its coverage and collected its packages -
# those are what tell you whether the run was otherwise sound. Failing here still stops the deploy
# phase, which only runs when everything before it succeeded.
# Upload-Coverage is gone from this list, and with it AppVeyor's Coveralls submission. Coverage now
# goes up from GitHub Actions, through Coveralls' own action, which knows how to attribute a build to
# the run and the pull request that produced it. Two systems submitting the same numbers for one
# commit only ever produced two Coveralls builds and an argument about which was the later.
after_test:
  - dotnet cake --target=Pack --exclusive --configuration=%CONFIGURATION%
  - dotnet cake --target=Inspect-Code --exclusive --configuration=%CONFIGURATION%

artifacts:
  - path: artifacts\*.nupkg
    name: packages
  # Kept so a build whose upload was skipped or rejected can still be inspected.
  - path: coverage
    name: coverage
  # The raw SARIF, for opening in a viewer rather than reading off the messages tab.
  - path: inspection
    name: inspection

# There is deliberately no deploy_script any more. Publishing moved to GitHub Actions, and the
# phase was deleted in the same commit that gave that workflow its publish step, so no commit ever
# had both able to push the same tag. build.cake enforces the same thing from the other side:
# Publish returns early unless it is running on Actions with a tag ref, so restoring the phase here
# would produce a no-op rather than a second release.
#
# This file is otherwise unchanged, because AppVeyor is still building every commit alongside
# Actions while the two are compared. What it no longer does is release.
